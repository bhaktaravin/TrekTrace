name: Deploy to NAS

on:
  push:
    branches: [ backend ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Build with Maven
      run: ./mvnw clean package -DskipTests
      
    - name: Deploy to NAS via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.NAS_HOST }}
        username: ${{ secrets.NAS_USERNAME }}
        key: ${{ secrets.NAS_SSH_KEY }}
        source: "target/trektrace-*.jar,Dockerfile,docker-compose.yml,.env"
        target: "/volume1/docker/demo"
        
    - name: Restart Docker Container on NAS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.NAS_HOST }}
        username: ${{ secrets.NAS_USERNAME }}
        key: ${{ secrets.NAS_SSH_KEY }}
        script: |
          cd /volume1/docker/demo
          docker-compose down
          docker-compose up -d --build
